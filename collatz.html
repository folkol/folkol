<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Collatz</title>
</head>
<body style="background-color: black;">
    <canvas id=myCanvas width=2000 height=2000></canvas>
    <script type="text/javascript">
        var canvas = document.getElementById("myCanvas");
        var ctx = canvas.getContext("2d");
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.lineWidth = 1;
        const N = 1000;
        let tick = 1
        const delta = 10;
        const xScale = 10;

        let positions = [];
        for(let i = 0; i < N; i++) {
            positions[i] = i + 1;
        }

        let ticker = setInterval(() => {
            if(positions.every(e => e === 1)) {
                clearInterval(ticker);
            }
            let next_positions = positions.map(n => {
                if(n <= 1) {
                    return 1;
                } else if(n % 2 == 0) {
                    return n / 2;
                } else {
                    return n * 3 + 1;
                }
            });
            positions.forEach((e, i) => {
                ctx.strokeStyle = "hsl(" + (i * (360 / N) % 360) + ",100%,50%)";
                ctx.beginPath();
                ctx.moveTo(Math.log(e) * xScale * delta, tick);
                ctx.lineTo(Math.log(next_positions[i]) * xScale * delta, tick + delta);
                ctx.stroke();
            });
            positions = next_positions;
            tick += delta;
        }, 1000/60);
    </script>
</body>
</html>
