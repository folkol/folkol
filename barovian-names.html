        "ăscu",
        "eanu",

        "atu",
        "oiu",
    ]

    function pick(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function genMaleName() {
        return pick(maleGivenNames);
    }

    function genFemaleName() {
        let name = pick(femaleGivenNames);
        if (name.endsWith("ia")) {
            name = name.slice(0, -2) + pick(femaleSuffixes);
        }
        return name;
    }

    function genSurname() {
        function hardCoded() {
            return pick(surnames);
        }

        function toponyms() {
            return pick(surnameRoots) + pick(surnameSuffixes);
        }

        function patronyms() {
            return genMaleName().replace(/[aeiou]*$/, '') + pick(surnameSuffixes);
        }

        return pick([hardCoded, toponyms, patronyms])();
    }

    window.male.innerText = `${genMaleName()} ${genSurname()}`;
    window.female.innerText = `${genFemaleName()} ${genSurname()}`;
