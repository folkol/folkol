<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Whiteboard</title>
	<style>
		html {
			height: 100%;
		}
		body {
			height: 100%;
			margin: 0;
		}
		canvas {
			width: 100%;
			height: 100%;
			box-sizing: border-box;
			/*border: 20px solid black;*/
		}	
		ul {
			position: absolute;
			left: 0;
			up: 0;
		}
	</style>

</head>
<body>
	<!-- https://developer.mozilla.org/en-US/docs/Web/HTML/Element/canvas -->
	<ul id=log></ul>
	<canvas id=whiteboard width=1001 height=1001>
</body>
<script type="text/javascript">
	var canvas = document.getElementById("whiteboard");
	var ctx = canvas.getContext("2d");  // CanvasRenderingContext2D
	ctx.filter = 'invert()'
	// ctx.miterLimit = 1;
	// ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
	ctx.lineCap = "round"
	// ctx.globalAlpha = 0.9
	// ctx.translate(0.5, 0.5);
	// ctx.imageSmoothingEnabled = true;
	// ctx.fillRect(0, 0, 500, 750);
// ctx.moveTo(50, 140);
// ctx.lineTo(150, 60);
// ctx.lineTo(250, 140);
	let drawing = false,
		vx = 0,
		vy = 0;

	canvas.addEventListener('mousedown', e => {
		drawing = true;
		vx = e.offsetX / canvas.clientWidth;
		vy = e.offsetY / canvas.clientHeight;
		ctx.fillRect(vx * 1001 - 0.5, vy * 1001 - 0.5,1,1); // fill in the pixel at (10,10)
		ctx.beginPath();
		ctx.lineTo(vx * 1001, vy * 1001);
		ctx.stroke();
	});
	canvas.addEventListener('mouseup', e => {
		if(drawing) {
			drawing = false;
			vx = e.offsetX / canvas.clientWidth;
			vy = e.offsetY / canvas.clientHeight;
			ctx.lineTo(vx * 1001 - 0.5, vy * 1001 - 0.5);
			// ctx.closePath();
			ctx.stroke();
		}
	});
	canvas.addEventListener('mouseleave', e => {
		if(drawing) {
			drawing = false;
			vx = e.offsetX / canvas.clientWidth;
			vy = e.offsetY / canvas.clientHeight;
			ctx.lineTo(vx * 1001 - 0.5, vy * 1001 - 0.5);
			// ctx.closePath();
			ctx.stroke();
		}
	});
	canvas.addEventListener('mousemove', e => {
		vx = e.offsetX / canvas.clientWidth;
		vy = e.offsetY / canvas.clientHeight;
		if(drawing) {
			ctx.lineTo(vx * 1001, vy * 1001);
			ctx.stroke();
			// ctx.closePath();
			// ctx.stroke();
		}
	});
</script>
<script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>
<script type="text/javascript">
	var log = document.getElementById('log');
	function logger(msg) {
		let li = document.createElement('li')
		let text = document.createTextNode(msg);
		li.appendChild(text);
		log.appendChild(li);		
	}
	const urlParams = new URLSearchParams(window.location.search);
	logger(`urlParams: ${urlParams}`);
	const whiteboard_id = urlParams.get('whiteboard-id');
	logger(`whiteboard_id: ${whiteboard_id}`);
	var peer = new Peer(); 
	peer.on('open', id => {
		logger(`My id is ${id}`);
	})
	peer.on('connection', conn => {
		logger(`Incoming connection: ${JSON.stringify(conn)}`)
		conn.on('data', data => {
			logger(`data on conn: ${data}`)
			conn.send(`Greetings`)
		})
	})

	if(whiteboard_id) {
		var conn = peer.connect(whiteboard_id);
		logger(`connecting to peer: ${whiteboard_id}`)
		// on open will be launch when you successfully connect to PeerServer
		conn.on('open', function(){
			logger(`connection opened to ${conn.id}`)
			conn.send('hi!');
		});
		peer.on('connection', function(conn) {
			logger(`peer connection opened with ${conn.id}`)
			conn.on('data', function(data){
				logger(`data from peer connection: ${data}`)
		  });
		});
	} else {
		logger(`no peer`)
	}
</script>
</html>
