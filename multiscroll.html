<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN"
            "http://www.w3.org/TR/html4/strict.dtd">
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style type="text/css">
        html, body, div.content {
            height: 100%;
        }

        div.content {
            display: flex;
            flex-direction: row;
        }

        div.content iframe {
            flex: 1 1 auto;
            display: flex; /* new */
        }
    </style>
</head>
<frameset cols="50%, 50%">
    <frame id=foo src="https://www.wired.com/2012/03/ff-nsadatacenter/"></frame>
    <frame id=bar src="https://web.archive.org/web/20190110160840/https://www.wired.com/2012/03/ff_nsadatacenter/5/"></frame>
</frameset>
<script type="text/javascript">
    window.foo.addEventListener("scroll", (event) => {
        bar.scrollY = foo.scrollY;
        console.log("Scrolling scrolling scrolling...", foo.scrollY);
    });
</script>
</html>
